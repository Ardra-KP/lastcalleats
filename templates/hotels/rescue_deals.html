{% extends "base.html" %}
{% block title %}Rescue Deals{% endblock %}

{% block content %}

<section class="max-w-7xl mx-auto px-4 py-14">

<h1 class="text-4xl font-bold text-center mb-10">
🔥 Rescue Food Deals
</h1>

<div class="grid md:grid-cols-3 gap-10">

{% for food in foods %}
<div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition">

<img src="{{ food.image.url }}" class="w-full h-52 object-cover">

<div class="p-6">

<h2 class="text-xl font-bold mb-2">
{{ food.name }}
</h2>

<p class="text-gray-500 text-sm mb-2">
🏨 {{ food.hotel.name }}
</p>

<p class="text-red-500 font-semibold mb-3">
🔥 Only 3 meals left
</p>

<div class="flex justify-between items-center">

<span class="text-lg font-bold text-green-600">
₹{{ food.price }}
</span>

<a href="{% url 'food_detail' food.id %}"
class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600">
View Deal
</a>

</div>

</div>
</div>

{% endfor %}

</div>

</section>

{% endblock %}
